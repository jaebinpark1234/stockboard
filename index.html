<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3만원 주식 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#EEF1F4; --sheet:#FFFFFF; --ink:#142033; --mute:#5B6676; --rule:#D5DBE3;
  --up:#D7263D; --down:#1F5FD1; --amber:#E39B00; --ok:#18794E; --warnbg:#FFF3D6; --warn:#8A5A00;
  --s0:#E4E8EE; --s1:#C9D6EA; --s2:#8FB0E0; --s3:#3F7BD6; --s4:#1B4FA8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1724; --sheet:#172234; --ink:#E6ECF4; --mute:#94A1B3; --rule:#26344A;
  --up:#FF5A6E; --down:#5B9BFF; --amber:#FFB938; --ok:#4CC38A; --warnbg:#3A2C10; --warn:#FFCC66;
  --s0:#22304A; --s1:#26457A; --s2:#2F63B3; --s3:#4E8BEA; --s4:#9CC2FF;}}
:root[data-theme="dark"]{--paper:#0F1724; --sheet:#172234; --ink:#E6ECF4; --mute:#94A1B3; --rule:#26344A;
  --up:#FF5A6E; --down:#5B9BFF; --amber:#FFB938; --ok:#4CC38A; --warnbg:#3A2C10; --warn:#FFCC66;
  --s0:#22304A; --s1:#26457A; --s2:#2F63B3; --s3:#4E8BEA; --s4:#9CC2FF;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;font-feature-settings:"tnum"}
a{color:var(--down);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

/* 머리 */
header{padding:22px 0 10px}
.date{color:var(--mute);font-size:14px}
h1{font-size:28px;line-height:1.2;margin:2px 0 6px;font-weight:700;letter-spacing:-.02em}
.lead{color:var(--mute);font-size:14.5px;margin:0}

/* 탭 */
nav{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;margin:6px -16px 0;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--rule);background:transparent;border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 순위 행 */
.row{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--rule);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.row:hover .nm{text-decoration:underline}
.rk{font-size:30px;font-weight:700;line-height:1;color:var(--amber);text-align:right;padding-top:2px}
.rk.sm{font-size:20px;color:var(--mute)}
.nm{font-size:18px;font-weight:700;line-height:1.3}
.flagc{font-size:13px;margin-left:4px;color:var(--mute);font-weight:500}
.one{font-size:14px;color:var(--mute);margin-top:2px;line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;margin-top:8px}
.facts b{font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.verdict{display:inline-block;font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:1px 6px;margin-top:6px}
.warnline{font-size:12.5px;color:var(--warn);margin-top:6px}

/* 지문 띠: 6개 점수 */
.print{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:10px;max-width:420px}
.print span{height:22px;border-radius:2px;font-size:11px;line-height:22px;text-align:center;color:var(--ink)}
.print span.hi{color:var(--paper)}
.printkey{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;max-width:420px;font-size:11px;color:var(--mute);text-align:center;margin-top:2px}

/* 상세 시트 */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;transform:translateY(100%);transition:transform .28s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheethead{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:2}
.close{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.sheethead .t{font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sbody{max-width:760px;margin:0 auto;padding:16px 16px 100px}
.hero{padding:6px 0 14px}
.hero .nm{font-size:24px}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.part{margin-top:26px}
.part>h2{font-size:19px;margin:0 0 4px;font-weight:700}
.part>p.sub{margin:0 0 10px;color:var(--mute);font-size:14px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;margin:10px 0}
.note h3{font-size:15.5px;margin:16px 0 6px}
.note h3:first-child{margin-top:0}
.note p{margin:6px 0;font-size:15px}
.note ul{margin:4px 0;padding-left:18px} .note li{margin:5px 0;font-size:15px}
h4{font-size:14.5px;margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap}
.ex{color:var(--mute);font-size:13px}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.checks .m{width:20px;flex:none;text-align:center;font-weight:700}
.scroll{overflow-x:auto}
canvas{width:100%!important}
.news{padding-left:18px;margin:6px 0} .news li{margin:7px 0;font-size:14.5px}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}
.range{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:6px;margin:8px 0}
.range div{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 4px}
.range b{display:block;font-size:18px}
.range span{font-size:12px;color:var(--mute)}
.disclaim{font-size:13px;color:var(--mute);border-left:3px solid var(--amber);padding:2px 0 2px 10px;margin:14px 0}
.search{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;margin:14px 0 4px}
.empty{color:var(--mute);padding:20px 0}
footer{margin-top:30px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="date">불러오는 중</div>
    <h1>3만원 주식 노트</h1>
    <p class="lead" id="lead"></p>
  </header>
  <nav><div class="tabs" role="tablist" id="tabs"></div></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheethead"><button class="close" onclick="closeSheet()">닫기</button><div class="t" id="sheetTitle"></div></div>
  <div class="sbody" id="sbody"></div>
</div>
<script>
const W=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ko-KR');
const F=(n,d=1)=>n==null||isNaN(n)?'—':(+n).toFixed(d);
const pc=(n,d=1)=>n==null||isNaN(n)?'—':`<span class="${n>=0?'up':'down'}">${n>=0?'+':''}${F(n,d)}%</span>`;
const sg=n=>n==null?'—':`<span class="${n>=0?'up':'down'}">${n>=0?'+':''}${W(n)}</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYS=['가치','수익성','성장','모멘텀','안정','추세'];
const REG={KR:'한국',US:'미국',ADR:'해외'};
let D, FX, pool={}, charts=[];

const isUS=s=>s.region==='US'||s.region==='ADR';
const krw=s=>isUS(s)?s.price*FX:s.price;
const priceTxt=s=>isUS(s)?`$${F(s.price,2)} <span class="ex">(${W(s.price*FX)}원)</span>`:`${W(s.price)}원`;
const capTxt=s=>isUS(s)?W(s.cap/100)+'억 달러':(s.cap>=10000?F(s.cap/10000,2)+'조원':W(s.cap)+'억원');
const money=(s,v)=>v==null?'—':isUS(s)?(Math.abs(v)>=1000?F(v/1000,2)+'B':F(v,1)+'M'):(Math.abs(v)>=10000?F(v/10000,2)+'조':W(v)+'억');
const shares=s=>{const k=krw(s);const n=Math.floor(30000/k);return n>=1?`3만원 → ${n}주`:'소수점 매수'};
const passCount=s=>{const c=(s.check||[]).filter(x=>x[1]!==null);return c.length?`기준 ${c.filter(x=>x[1]===true).length}/${c.length} 통과`:''};

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  D=d; FX=d.fx;
  for(const r in d.regions) for(const s of d.regions[r].top){ s.region=s.region||r; pool[s.code]=s; }
  document.getElementById('date').textContent=`${d.updated} 업데이트 · 환율 ${W(FX)}원`;
  const n=Object.values(d.regions).reduce((a,r)=>a+r.analyzed,0);
  document.getElementById('lead').textContent=`오늘 ${n.toLocaleString()}개 회사를 같은 공식으로 계산했어요. 1주 3만원 이하, 시가총액이 작은 회사만 봐요.`;
  const tabs=[['top','분석 순위'],['KR','한국'],['US','미국'],['ADR','해외'],['mine','내 종목'],['how','계산법']];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab" role="tab" data-k="${k}" aria-selected="false" onclick="show('${k}')">${l}</button>`).join('');
  document.getElementById('foot').innerHTML=`출처: 네이버증권 API(시세·재무), 금융감독원 DART(한국 공식 재무${d.dart?'':' — 키 연결 전'}), 미국 SEC EDGAR(미국 공식 재무·공시). 추천이 아니라 분석 정리예요. 사는 판단은 직접 하세요.`;
  let start='top'; try{start=localStorage.getItem('tab')||'top'}catch(e){}
  show(start);
});

function show(k){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k));
  try{localStorage.setItem('tab',k)}catch(e){}
  const m=document.getElementById('main');
  if(k==='top'){
    const list=(D.featured||[]).map(c=>pool[c]).filter(Boolean).sort((a,b)=>a.note.rank-b.note.rank);
    m.innerHTML=`<p class="disclaim">회사마다 실적 발표·공시·뉴스를 직접 읽고 쓴 분석이에요. 순위 = 이익의 질 35% + 가격 매력 25% + 6개월 촉매 25% − 위험 15%. 숫자와 그래프는 매일 아침 새로 계산돼요.</p>`+list.map(s=>row(s,s.note.rank,true)).join('');
  } else if(D.regions[k]){
    const r=D.regions[k];
    m.innerHTML=`<p class="disclaim">${REG[k]} 후보 ${r.universe.toLocaleString()}개 중 재무를 계산한 ${r.analyzed.toLocaleString()}개의 점수 순위 상위 ${r.top.length}개. ${k==='ADR'?'토스에서 살 수 있도록 미국 증시에 상장된 외국 회사만 골랐어요.':''} 서술 분석이 없는 종목은 숫자·그래프만 있어요.</p>
    <input class="search" placeholder="${REG[k]} 전체에서 이름·코드로 찾기" oninput="find(this.value,'${k}')"><div id="found"></div>`+r.top.map((s,i)=>row(s,i+1,false)).join('');
  } else if(k==='mine'){ m.innerHTML=mine(); }
  else { m.innerHTML=how(); }
  window.scrollTo(0,0);
}

function cellColor(v){return v==null?'var(--s0)':v>=80?'var(--s4)':v>=60?'var(--s3)':v>=40?'var(--s2)':v>=20?'var(--s1)':'var(--s0)'}
function print(s){const g=s.groups||{};return `<div class="print" aria-label="점수 지문">${KEYS.map(k=>`<span class="${(g[k]||0)>=60?'hi':''}" style="background:${cellColor(g[k])}" title="${k} ${g[k]??'—'}">${g[k]??'—'}</span>`).join('')}</div><div class="printkey">${KEYS.map(k=>`<span>${k}</span>`).join('')}</div>`}

function row(s,rank,featured){
  const n=s.note, one=n?.oneliner||(s.about||[]).find(x=>/제조|생산|공급|개발|판매|·/.test(x))||(s.about||[])[0]||'';
  return `<button class="row" onclick="openSheet('${s.code}')">
    <div class="rk ${featured?'':'sm'}">${rank}</div>
    <div><div class="nm">${esc(s.name)}<span class="flagc">${REG[s.region]||''} ${esc(s.sector||'')}</span></div>
    <div class="one">${esc(one)}</div>
    <div class="facts"><span><b>${priceTxt(s)}</b> ${pc(s.chg)}</span><span>${shares(s)}</span><span>점수 <b>${s.score}</b></span><span>${passCount(s)}</span></div>
    ${n?.verdict?`<span class="verdict">${esc(n.verdict)}</span>`:''}
    ${(s.flags||[]).length?`<div class="warnline">⚠ ${s.flags.map(esc).join(' / ')}</div>`:''}
    ${print(s)}</div></button>`;
}

function find(v,k){
  const box=document.getElementById('found'); v=v.trim();
  if(!v){box.innerHTML='';return}
  const rows=D.all.filter(s=>(k==='KR'?!s.region:s.region===k)&&(s.name.includes(v)||s.code.toLowerCase().includes(v.toLowerCase()))).slice(0,15);
  box.innerHTML=`<div class="box scroll"><table><tr><th>종목</th><th class="n">점수</th><th class="n">PER</th><th class="n">ROE</th><th class="n">1년</th></tr>${rows.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${s.score}</td><td class="n">${F(s.per)}</td><td class="n">${F(s.roe_last)}</td><td class="n">${pc(s.ret1y,0)}</td></tr>`).join('')||'<tr><td class="ex">조건(3만원 이하·소형주) 밖이거나 재무 자료가 없어요</td></tr>'}</table></div>`;
}

/* ---------- 상세 ---------- */
function openSheet(code){
  const s=pool[code]; if(!s) return;
  charts.forEach(c=>c.destroy()); charts=[];
  document.getElementById('sheetTitle').textContent=s.name;
  document.getElementById('sbody').innerHTML=detail(s);
  const sh=document.getElementById('sheet'); sh.classList.add('on'); sh.scrollTop=0; document.body.style.overflow='hidden';
  history.pushState({sheet:1},'');
  requestAnimationFrame(()=>draw(s));
}
function closeSheet(fromPop){document.getElementById('sheet').classList.remove('on');document.body.style.overflow='';if(!fromPop&&history.state?.sheet)history.back()}
window.addEventListener('popstate',()=>closeSheet(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function L(title,arr,ul=true){return arr&&arr.length?`<h3>${title}</h3>${ul?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:arr.map(x=>`<p>${esc(x)}</p>`).join('')}`:''}

function detail(s){
  const n=s.note, p=s.p3m, bd=s.band||{}, pr=s.peers||{}, f=s.flow, sec=s.sec;
  const fcf=(s.dart&&s.dart.fcf)||(sec&&sec.fcf)||[];
  const cur=isUS(s)?'백만 달러':'억원';
  return `
  <div class="hero">
    <div class="ex">${REG[s.region]||''} ${esc(s.sector||'')} ${esc(s.code)}</div>
    <div class="nm">${esc(s.name)}</div>
    ${n?`<p style="margin:6px 0 0">${esc(n.oneliner)}</p>`:''}
    <div style="margin-top:10px"><span class="big">${priceTxt(s)}</span> ${pc(s.chg)}</div>
    <div class="facts"><span>${shares(s)}</span><span>시가총액 ${capTxt(s)}</span><span>점수 <b>${s.score}</b></span><span>${passCount(s)}</span></div>
    ${n?`<span class="verdict">분석 순위 ${n.rank}위 · ${esc(n.verdict)}</span>`:''}
    ${print(s)}
    ${(s.flags||[]).length?`<div class="warnline">⚠ ${s.flags.map(esc).join(' / ')}</div>`:''}
  </div>

  ${n?`<div class="box note">
    ${L('지금 무엇으로 뜨고 있나',n.now,false)}
    ${L('6개월 안에 주가를 움직일 계기',n.catalysts)}
    ${L('경제적 해자: 남이 못 따라오는 무기',n.moat)}
    ${L('가격결정력: 원가가 오르면 값을 올릴 수 있나',n.pricing)}
    ${L('최악의 시나리오: 치명적 위험',n.risks)}
    ${L('금리·환율이 미치는 영향',n.macro)}
    ${L('숫자로 본 결론',n.math)}
    ${n.sources?`<p class="ex">근거: ${n.sources.map(x=>`<a href="${x.u}" target="_blank" rel="noopener">${esc(x.t)}</a>`).join(', ')} · ${esc(D.featured_written||'2026-10-05')} 작성</p>`:''}
  </div>`:`<p class="disclaim">이 종목은 아직 서술 분석 전이에요. 아래 숫자와 그래프는 매일 새로 계산돼요.</p>`}

  <section class="part"><h2>재빈 기준 체크리스트</h2>
  <ul class="checks">${(s.check||[]).map(([t,v])=>`<li><span class="m" style="color:${v===true?'var(--ok)':v===false?'var(--up)':'var(--mute)'}">${v===true?'✓':v===false?'✗':'?'}</span>${t}${v===null?' <span class="ex">(자료 없음)</span>':''}</li>`).join('')}</ul></section>

  <section class="part"><h2>① 기초 체력</h2><p class="sub">얼마나 벌고, 얼마나 효율적으로 버는가 (${cur})</p>
  <h4>연간 매출·영업이익과 영업이익률</h4><canvas id="cA" height="200"></canvas>
  <h4>분기 실적: 지금 뜨는 중인가</h4><canvas id="cQ" height="200"></canvas>
  ${fcf.length?`<h4>잉여현금흐름 FCF (${s.dart?'DART':'SEC'} 공식${fcf[0].unit&&fcf[0].unit!=='USD'?', 단위 백만 '+fcf[0].unit:''})</h4>
  <table><tr><th>연도</th><th class="n">영업현금</th><th class="n">설비투자</th><th class="n">FCF</th></tr>${fcf.map(x=>`<tr><td>${x.year}</td><td class="n">${W(x.ocf)}</td><td class="n">${W(-Math.abs(x.capex))}</td><td class="n">${sg(x.fcf)}</td></tr>`).join('')}</table>
  <p class="ex">FCF = 영업으로 번 현금 − 공장·설비 투자. 꾸준히 +여야 장부 이익이 '진짜 현금'이에요.</p>`:`<p class="ex">FCF: ${isUS(s)?'SEC 자료에 설비투자 항목이 없어 계산하지 않았어요.':'DART 키를 연결하면 공식 현금흐름표로 계산돼요.'}</p>`}
  <div class="scroll"><table>

function valText(s){
  const t=[], pe=s.per, b=(s.band||{}).per_avg, m=(s.peers||{}).per_med;
  if(pe&&b) t.push(`자기 과거 평균보다 ${pe<b?`${F((1-pe/b)*100,0)}% 싸게`:`${F((pe/b-1)*100,0)}% 비싸게`}`);
  if(pe&&m) t.push(`같은 업종 중앙값보다 ${pe<m?`${F((1-pe/m)*100,0)}% 싸게`:`${F((pe/m-1)*100,0)}% 비싸게`}`);
  return t.length?`지금 PER은 ${t.join(', ')} 거래되고 있어요.`:'';
}

function dartBlock(s){
  if(isUS(s)) return '';
  if(!s.dart) return `<h4>공식 자료 대조</h4><p class="ex">DART 키가 연결되면 네이버 숫자를 금융감독원 공식 사업보고서와 자동으로 비교해요.</p>`;
  const d=s.dart;
  return `<h4>공식 자료 대조 (DART ${d.year}년 ${d.fs==='CFS'?'연결':'별도'})</h4>
  <p>${d.ok?'<b style="color:var(--ok)">네이버 숫자와 일치 (오차 3% 미만)</b>':'<b style="color:var(--up)">불일치가 있어요. 원문을 확인하세요</b>'}</p>
  <table><tr><th>항목</th><th class="n">DART</th><th class="n">네이버</th><th class="n">차이</th></tr>${d.check.map(r=>`<tr><td>${r.item}</td><td class="n">${money(s,r.dart)}</td><td class="n">${money(s,r.naver)}</td><td class="n">${r.diff==null?'—':F(r.diff)+'%'}</td></tr>`).join('')}</table>
  ${d.disclosures.length?`<h4>최근 공시 (DART 공식)</h4><ul class="news">${d.disclosures.map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="ex">${x.date}</span></li>`).join('')}</ul>`:''}`;
}

function draw(s){
  const cs=getComputedStyle(document.documentElement), v=k=>cs.getPropertyValue(k).trim();
  const ink=v('--mute'), up=v('--up'), dn=v('--down'), am=v('--amber'), rule=v('--rule');
  Chart.defaults.font.family='"IBM Plex Sans KR",sans-serif'; Chart.defaults.color=ink;
  const base=(y={})=>({responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{boxWidth:10,font:{size:11}}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,font:{size:11}}},y:{grid:{color:rule},ticks:{font:{size:11}},...y}}});
  const mk=(id,cfg)=>{const el=document.getElementById(id); if(!el) return;
    const box=document.createElement('div'); box.style.cssText=`position:relative;height:${el.getAttribute('height')}px;width:100%`;   // 차트 전용 고정 높이 상자(없으면 무한 확장)
    el.replaceWith(box); box.appendChild(el); charts.push(new Chart(el,cfg));};
  const ch=s.chart;
  if(ch){
    const lb=ch.d.map(d=>d.slice(2,4)+'.'+d.slice(4,6)), ln=(label,data,color,w=1,dash)=>({type:'line',label,data,borderColor:color,pointRadius:0,borderWidth:w,borderDash:dash,spanGaps:true});
    mk('cP',{data:{labels:lb,datasets:[ln('종가',ch.c,v('--ink'),1.8),ln('20일',ch.ma20,am),ln('60일',ch.ma60,'#2E9E6A'),ln('120일',ch.ma120,'#8B5CF6'),ln('밴드 상단',ch.bbu,ink,.8,[3,3]),ln('밴드 하단',ch.bbl,ink,.8,[3,3])]},options:base()});
    mk('cV',{type:'bar',data:{labels:lb,datasets:[{label:'거래량',data:ch.v,backgroundColor:dn+'88'}]},options:{...base(),plugins:{legend:{display:false}}}});
    mk('cR',{data:{labels:lb,datasets:[ln('RSI',ch.rsi,am,1.4),ln('70',ch.rsi.map(()=>70),up,.8,[4,4]),ln('30',ch.rsi.map(()=>30),dn,.8,[4,4])]},options:{...base({min:0,max:100}),plugins:{legend:{display:false}}}});
    const h=ch.macd.map((m,k)=>m-ch.sig[k]);
    mk('cM',{data:{labels:lb,datasets:[{type:'bar',label:'막대',data:h,backgroundColor:h.map(x=>x>=0?up+'AA':dn+'AA')},ln('MACD',ch.macd,v('--ink'),1.2),ln('시그널',ch.sig,am,1.2)]},options:{...base(),plugins:{legend:{display:false}}}});
  }
  const bars=(id,labels,rev,op)=>{
    const opm=op.map((o,j)=>o!=null&&rev[j]?o/rev[j]*100:null);
    mk(id,{data:{labels,datasets:[{type:'bar',label:'매출',data:rev,backgroundColor:dn+'55',yAxisID:'y'},{type:'bar',label:'영업이익',data:op,backgroundColor:up,yAxisID:'y'},{type:'line',label:'영업이익률 %',data:opm,borderColor:am,backgroundColor:am,yAxisID:'y2',pointRadius:3,borderWidth:2}]},
      options:{...base(),scales:{x:{grid:{display:false}},y:{grid:{color:rule}},y2:{position:'right',grid:{display:false},ticks:{color:am,callback:x=>x+'%'}}}}});
  };
  bars('cA',s.years.map(k=>String(k).slice(0,4)),s.rev,s.op);
  if(s.qtr){const k=s.qtr.keys; bars('cQ',k.map(x=>String(x).includes('.')?x:x.slice(2,4)+'.'+x.slice(4)),s.qtr.rev.slice(0,k.length),s.qtr.op.slice(0,k.length));}
  if(s.flow&&s.flow.daily){const d=s.flow.daily; mk('cF',{type:'bar',data:{labels:d.map(x=>x[0].slice(4,6)+'.'+x[0].slice(6)),datasets:[{label:'외국인(억원)',data:d.map(x=>x[1]),backgroundColor:dn},{label:'기관(억원)',data:d.map(x=>x[2]),backgroundColor:am}]},options:base()});}
}

function mine(){

  return P.map(p=>`<div class="box"><div class="nm">${esc(p.name)}</div>

  <div class="range"><div><b>${pc(p.ret)}</b><span>내 수익률</span></div><div><b>${pc(p.market_part)}</b><span>시장 때문</span></div><div><b>${pc(p.own_part)}</b><span>회사 때문</span></div></div>
  <p class="ex">시장 몫 = 베타 ${F(p.beta,2)} × 같은 기간 지수 ${pc(p.mkt)}</p>
  ${p.note?`<div class="note">${L(p.ret>=0?'왜 올랐나':'왜 내렸나',p.note.why)}${L('배운 점과 분석 업그레이드',p.note.lesson)}</div>`:''}
  ${p.news&&p.news.length?`<h4>산 뒤 나온 뉴스</h4><ul class="news">${p.news.map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join('')}</ul>`:''}</div>`).join('');
}

function how(){
  return `<div class="box note"><h3>매일 아침 이렇게 계산해요</h3>
