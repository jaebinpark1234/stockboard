<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3만원 주식 노트</title>
<meta name="description" content="1주 3만원 이하 한국·미국·해외 주식을 매일 아침 재무·수학·뉴스로 분석한 노트">
<meta property="og:title" content="3만원 주식 노트">
<meta property="og:description" content="매일 아침 2,400개 회사를 계산하고 11개를 깊게 분석해요">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233182F6'/><path d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --ink2:#4E5968; --mute:#8B95A1; --line:#E5E8EB; --fill:#F9FAFB;
  --up:#F04452; --down:#3182F6; --blue:#3182F6; --green:#00A661; --greenbg:#E8F7EF; --redbg:#FFEEEE; --amber:#FFB000; --amberbg:#FFF6E0;
  --r-lg:20px; --r-md:14px; --r-sm:8px;
  --shadow:0 1px 2px rgba(25,31,40,.04),0 4px 16px rgba(25,31,40,.04);
  --z-nav:10; --z-sheet:30; --z-sheethead:31;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#0F0F12; --ink:#FFFFFF; --ink2:#C9CDD3; --mute:#8A8F98; --line:#1F1F24; --fill:#17171B;
  --up:#F45563; --down:#4C94FF; --blue:#4C94FF; --green:#2BC27E; --greenbg:#17321F; --redbg:#3A1C20; --amber:#FFC23D; --amberbg:#3A2E12;
  --shadow:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--blue);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--card);padding:8px 12px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
.up{color:var(--up)}.down{color:var(--down)}
p{text-wrap:pretty}

/* 머리 */
header{padding:28px 4px 8px}
.date{color:var(--mute);font-size:13px;font-weight:500}
h1{font-size:26px;line-height:1.25;margin:4px 0 0;font-weight:700;letter-spacing:-.03em}

/* 탭 */
nav.top{position:sticky;top:0;z-index:var(--z-nav);background:var(--bg);margin:0 -16px;padding:10px 16px 10px}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg button:active{transform:scale(.97)}

/* 카드 공통 */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;margin:12px 0}
.cardtitle{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13.5px;margin:0}

/* 오늘의 1위 히어로 */
.hero{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center}
.hero .label{font-size:13px;font-weight:600;color:var(--blue)}
.hero .name{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:2px 0 6px}
.hero .why{font-size:14px;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero .px{margin-top:12px;font-size:15px}
.hero .px b{font-size:20px;letter-spacing:-.02em}

/* 순위 리스트 */
.list{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:4px 0;margin:12px 0}
.item{display:grid;grid-template-columns:28px 1fr 84px;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 18px;transition:background .15s}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:var(--fill)} .item:active{background:var(--line)}
.rank{font-size:17px;font-weight:700;color:var(--blue);text-align:center}
.rank.plain{color:var(--mute);font-weight:600;font-size:15px}
.iname{font-size:16.5px;font-weight:650;letter-spacing:-.02em;line-height:1.35}
.itag{font-size:12px;font-weight:600;color:var(--mute);margin-left:6px}
.ione{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.imeta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}
.imeta b{color:var(--ink);font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;margin-top:6px}
.badge.warn{background:var(--amberbg);color:#B26B00}
@media (prefers-color-scheme:dark){.badge.warn{color:var(--amber)}}
.badge.risk{background:var(--redbg);color:var(--up)}
.radar{display:block}
.radar .grid{fill:none;stroke:var(--line);stroke-width:1}
.radar .shape{stroke-width:1.5}
.radar text{font-size:9.5px;fill:var(--mute);font-family:inherit}

/* 검색 */
.search{width:100%;padding:13px 16px;border:0;border-radius:var(--r-md);background:var(--card);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.search::placeholder{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--mute);font-size:12.5px}
td.n,th.n{text-align:right;white-space:nowrap}
.ex{color:var(--mute);font-size:12.5px;line-height:1.5}
.note{font-size:13.5px;color:var(--ink2);background:var(--fill);border-radius:var(--r-md);padding:12px 14px;margin:12px 0}

/* 스켈레톤 */
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--fill) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* 상세 시트 */
.sheet{position:fixed;inset:0;z-index:var(--z-sheet);background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.shead{position:sticky;top:0;z-index:var(--z-sheethead);background:var(--bg)}
.sbar{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;max-width:640px;margin:0 auto}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.back:hover{background:var(--line)}
.stitle{font-weight:700;font-size:16px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.stitle.show{opacity:1}
.jump{max-width:640px;margin:0 auto;padding:4px 12px 10px;border-bottom:1px solid var(--line)}
.jump button{font-size:14px;padding:6px 12px}
.sbody{max-width:640px;margin:0 auto;padding:4px 16px 120px}
.top1{padding:12px 4px 4px}
.top1 .meta{font-size:13px;color:var(--mute);font-weight:500}
.top1 .nm{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:2px 0}
.top1 .bigpx{font-size:30px;font-weight:700;letter-spacing:-.03em}
.top1 .chg{font-size:16px;font-weight:600;margin-left:6px}
.oneliner{font-size:15px;color:var(--ink2);margin:8px 0 0}

/* 요약 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{background:var(--fill);border-radius:var(--r-md);padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--mute);font-weight:500}
.tile .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:12px;color:var(--ink2);margin-top:1px}

/* 분석 블록 */
.blk{border-radius:var(--r-md);padding:14px 16px;margin:10px 0;background:var(--fill)}
.blk h3{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.blk h3 i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mute)}
.blk.good h3 i{background:var(--green)} .blk.bad h3 i{background:var(--up)} .blk.info h3 i{background:var(--blue)}
.blk.bad{background:var(--redbg)}
.blk ul{margin:0;padding-left:18px}.blk li{margin:6px 0;font-size:14.5px;line-height:1.6}
.blk p{margin:6px 0;font-size:14.5px;line-height:1.65}
.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.checks li:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:#fff}
.dot.y{background:var(--green)} .dot.n{background:var(--up)} .dot.q{background:var(--line);color:var(--mute)}
h4{font-size:14.5px;margin:20px 0 8px;letter-spacing:-.02em}
.period{display:flex;gap:4px;margin:4px 0 8px}
.period button{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;color:var(--mute)}
.period button[aria-pressed="true"]{background:var(--fill);color:var(--ink)}
.range3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.range3 div{background:var(--fill);border-radius:var(--r-md);padding:12px 6px;text-align:center}
.range3 b{display:block;font-size:17px;letter-spacing:-.02em}
.range3 span{font-size:11.5px;color:var(--mute)}
.news{list-style:none;padding:0;margin:0}
.news li{padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5}
.news li:last-child{border-bottom:0}
.news .ex{display:block;margin-top:2px}
details>summary{cursor:pointer;font-weight:600;font-size:14px;padding:8px 0;color:var(--ink2)}
.scroll{overflow-x:auto}
/* 로빈후드식 가격 히어로 */
.phero{padding:8px 4px 0}
.phero .tk{font-size:13px;font-weight:600;color:var(--mute)}
.phero .nm{font-size:26px;font-weight:600;letter-spacing:-.03em;margin:2px 0 0}
.phero .px{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1.15;margin-top:2px}
.phero .dl{font-size:14.5px;font-weight:600;margin-top:2px;min-height:22px}
.phero .dl small{color:var(--mute);font-weight:500;margin-left:6px}
.pchart{position:relative;height:250px;margin:14px -16px 0;touch-action:pan-y}
.pdate{position:absolute;top:-2px;left:0;font-size:11.5px;color:var(--mute);font-weight:600;transform:translateX(-50%);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.pills{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;gap:2px}
.pills button{font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:8px;color:var(--pc,var(--up))}
.pills button[aria-pressed="true"]{background:var(--pc,var(--up));color:var(--bg)}
.pills .adv{border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.pills .adv[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:var(--z-sheethead);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(92vw,420px)}
.dock .t{flex:1;font-size:13px;line-height:1.3;color:var(--ink2)}
.dock .t b{display:block;color:var(--ink);font-size:14.5px}
.dock a{background:var(--pc,var(--up));color:#fff;font-weight:700;font-size:15px;padding:12px 22px;border-radius:999px;text-decoration:none;white-space:nowrap}
.dock a:active{transform:scale(.97)}
.spark{display:block}
.chgpill{display:inline-block;min-width:70px;text-align:center;font-size:13px;font-weight:700;color:#fff;border-radius:8px;padding:5px 8px;margin-top:6px}
footer{font-size:12.5px;color:var(--mute);padding:8px 4px;line-height:1.6}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="wrap">
  <header><div class="date" id="date">&nbsp;</div><h1>3만원 주식 노트</h1></header>
  <nav class="top" aria-label="보기 선택"><div class="seg" role="tablist" id="tabs"></div></nav>
  <main id="main">
    <div class="card"><div class="sk" style="height:18px;width:40%"></div><div class="sk" style="height:28px;width:70%;margin-top:10px"></div><div class="sk" style="height:60px;margin-top:12px"></div></div>
    <div class="list" style="padding:16px 18px"><div class="sk" style="height:44px"></div><div class="sk" style="height:44px;margin-top:14px"></div><div class="sk" style="height:44px;margin-top:14px"></div></div>
  </main>
  <footer id="foot"></footer>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">
  <div class="shead">
    <div class="sbar"><button class="back" onclick="closeSheet()" aria-label="닫기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><div class="stitle" id="stitle"></div></div>
    <div class="jump"><div class="seg" id="jump"></div></div>
  </div>
  <div class="sbody" id="sbody"></div>
  <div class="dock" id="dock"></div>
</div>

<script>
const W=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ko-KR');
const F=(n,d=1)=>n==null||isNaN(n)?'—':(+n).toFixed(d);
const pc=(n,d=1)=>n==null||isNaN(n)?'—':`<span class="${n>=0?'up':'down'}">${n>=0?'+':''}${F(n,d)}%</span>`;
const sg=n=>n==null?'—':`<span class="${n>=0?'up':'down'}">${n>=0?'+':''}${W(n)}</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYS=['가치','저변동','소형','재무개선','수익성','성장'];
const REG={KR:'한국',US:'미국',ADR:'해외'};
let D, FX, pool={}, charts=[], cur=null;

const isUS=s=>s.region==='US'||s.region==='ADR';
const krw=s=>isUS(s)?s.price*FX:s.price;
const pxTxt=s=>isUS(s)?`$${F(s.price,2)}`:`${W(s.price)}원`;
const pxKrw=s=>isUS(s)?`${W(s.price*FX)}원`:'';
const capTxt=s=>isUS(s)?W(s.cap/100)+'억 달러':(s.cap>=10000?F(s.cap/10000,1)+'조원':W(s.cap)+'억원');
const money=(s,v)=>v==null?'—':isUS(s)?(Math.abs(v)>=1000?F(v/1000,2)+'B':F(v,1)+'M'):(Math.abs(v)>=10000?F(v/10000,2)+'조':W(v)+'억');
const shares=s=>{const n=Math.floor(30000/krw(s));return n>=1?`3만원으로 ${n}주`:'소수점으로 매수'};
const pass=s=>{const c=(s.check||[]).filter(x=>x[1]!==null);return [c.filter(x=>x[1]===true).length,c.length]};

/* 3개월 스파크라인 */
function spark(s,w=84,h=34){
  const c=(s.chart&&s.chart.c||[]).slice(-63); if(c.length<2) return '';
  const lo=Math.min(...c),hi=Math.max(...c),sp=hi-lo||1;
  const pts=c.map((v,i)=>`${(i/(c.length-1)*w).toFixed(1)},${(h-2-(v-lo)/sp*(h-4)).toFixed(1)}`).join(' ');
  const col=c[c.length-1]>=c[0]?'var(--up)':'var(--down)';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
/* 6각 레이더: 점수 모양 (Simply Wall St 스노우플레이크 방식) */
function radar(s,size=64,labels=false){
  const g=s.groups||{}, n=6, c=size/2, R=labels?size/2-30:size/2-3;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [c+r*Math.cos(a),c+r*Math.sin(a)]};
  const ring=f=>KEYS.map((_,i)=>pt(i,R*f).join(',')).join(' ');
  const vals=KEYS.map(k=>Math.max(.06,(g[k]??50)/100));
  const avg=vals.reduce((a,b)=>a+b,0)/n;
  const col=avg>=.65?'var(--green)':avg>=.45?'var(--blue)':'var(--amber)';
  const shape=vals.map((v,i)=>pt(i,R*v).join(',')).join(' ');
  return `<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${KEYS.map(k=>k+' '+(g[k]??'—')).join(', ')}">
    <polygon class="grid" points="${ring(1)}"/><polygon class="grid" points="${ring(.5)}"/>
    <polygon class="shape" points="${shape}" fill="${col}" fill-opacity=".28" stroke="${col}"/>
    ${labels?KEYS.map((k,i)=>{const [x,y]=pt(i,R+15);return `<text x="${x}" y="${y+3}" text-anchor="middle">${k} ${g[k]??''}</text>`}).join(''):''}</svg>`;
}

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  D=d; FX=d.fx;
  for(const r in d.regions) for(const s of d.regions[r].top){ s.region=s.region||r; if(s.note&&s.note.region&&isUS(s)&&s.note.region!=='KR') s.region=s.note.region; pool[s.code]=s; }
  const n=Object.values(d.regions).reduce((a,r)=>a+r.analyzed,0);
  document.getElementById('date').textContent=`${d.updated.slice(5,10).replace('-','월 ')}일 아침 · ${n.toLocaleString()}개 회사 계산`;
  const tabs=[['top','분석 순위'],['KR','한국'],['US','미국'],['ADR','해외'],['proof','검증'],['mine','내 종목'],['how','계산법']];
  document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button role="tab" data-k="${k}" aria-selected="false" onclick="show('${k}')">${l}</button>`).join('');
  document.getElementById('foot').innerHTML=`시세·재무 네이버증권, 공식 재무 ${d.dart?'DART·':''}SEC EDGAR. 환율 ${W(FX)}원. 추천이 아니라 분석 정리예요. 고르는 건 직접 하세요.`;
  let start='top'; try{start=localStorage.getItem('tab')||'top'}catch(e){}
  show(D.regions[start]||['top','mine','how','proof'].includes(start)?start:'top');
  const h=location.hash.slice(1); if(h&&pool[decodeURIComponent(h)]) openSheet(decodeURIComponent(h),true);
}).catch(()=>{document.getElementById('main').innerHTML=`<div class="card"><p class="cardtitle">데이터를 불러오지 못했어요</p><p class="sub">인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`});

function show(k){
  document.querySelectorAll('#tabs button').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k));
  try{localStorage.setItem('tab',k)}catch(e){}
  const m=document.getElementById('main');
  if(k==='top'){

function find(v,k){
  const box=document.getElementById('found'); v=v.trim();

  const rows=D.all.filter(s=>(k==='KR'?!s.region:s.region===k)&&(s.name.includes(v)||s.code.toLowerCase().includes(v.toLowerCase()))).slice(0,15);
  box.innerHTML=`<div class="card scroll" style="padding:8px 16px"><table><tr><th>종목</th><th class="n">점수</th><th class="n">PER</th><th class="n">ROE</th><th class="n">1년</th></tr>${rows.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${s.score}</td><td class="n">${F(s.per)}</td><td class="n">${F(s.roe_last)}</td><td class="n">${pc(s.ret1y,0)}</td></tr>`).join('')||'<tr><td class="ex">3만원 초과이거나 시가총액 조건 밖이에요</td></tr>'}</table></div>`;

const SECTIONS=[['s-sum','요약'],['s-fund','체력'],['s-val','가격'],['s-math','차트·수학'],['s-flow','수급'],['s-news','뉴스']];
function openSheet(code,noPush){
  const s=pool[code]; if(!s) return; cur=s;
  charts.forEach(c=>c.destroy()); charts=[];
  document.getElementById('stitle').textContent=s.name;
  document.getElementById('jump').innerHTML=SECTIONS.map(([id,l])=>`<button onclick="jumpTo('${id}')">${l}</button>`).join('');
  document.getElementById('sbody').innerHTML=detail(s);
  const sh=document.getElementById('sheet'); sh.classList.add('on'); sh.scrollTop=0; document.body.style.overflow='hidden';
  if(!noPush) history.pushState({sheet:1},'','#'+encodeURIComponent(code));
  sh.onscroll=()=>document.getElementById('stitle').classList.toggle('show',sh.scrollTop>90);
  dock(s); RANGE=63; ADV=false;
  setTimeout(()=>draw(s),30);
}
function closeSheet(fromPop){document.getElementById('sheet').classList.remove('on');document.getElementById('dock').innerHTML='';document.body.style.overflow='';if(!fromPop&&history.state?.sheet)history.back();else history.replaceState(null,'',location.pathname)}
function jumpTo(id){const sh=document.getElementById('sheet'),el=document.getElementById(id);sh.scrollTo({top:el.getBoundingClientRect().top+sh.scrollTop-112,behavior:'smooth'})}
window.addEventListener('popstate',()=>closeSheet(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

   <div class="tile"><div class="k">방어선 (120일선)</div><div class="v">${fp(t.ma120)}</div><div class="d">${t.above120?'지금 위에 있음':'지금 아래에 있음'}</div></div>

/* ---------- 검증(백테스트) ---------- */
function proof(){
  const BT=D.backtest||{}; if(!BT.KR&&!BT.US) return `<div class="card"><div class="cardtitle">검증 결과 준비 중</div></div>`;
  const reg=(k,name)=>{const r=BT[k]; if(!r) return '';
    const fs=Object.entries(r.factors).sort((a,b)=>b[1].ic_mean-a[1].ic_mean);
    return `<div class="card"><div class="cardtitle">${name}: 점수 상위 20%는 실제로 올랐나</div>
    <p class="sub">과거 시점에 오늘과 같은 공식으로 점수를 매기고, 그 뒤 12개월 실제 수익률을 쟀어요. 가중치는 그 시점을 뺀 나머지 기간으로만 정했어요(미리 답을 보지 않은 시험).</p>
    <canvas id="pw${k}" height="200"></canvas>
    <table style="margin-top:6px"><tr><th>형성 시점</th><th class="n">상위 20%</th><th class="n">전체</th><th class="n">상위 11개</th><th class="n">적중률</th></tr>
    ${r.walk.map(w=>`<tr><td>${w.test}년 4월 → 12개월</td><td class="n">${pc(w.top20_med,0)}</td><td class="n">${pc(w.all_med,0)}</td><td class="n">${pc(w.top11_mean,0)}</td><td class="n">${F(w.hit,0)}%</td></tr>`).join('')}</table>
    <p class="ex">상위 20%·전체는 중앙값(한두 종목 대박에 휘둘리지 않게), 상위 11개는 평균. 적중률 = 상위 20% 중 전체 중앙값보다 오른 비율(50%가 동전 던지기). 표본 ${Object.entries(r.n).map(([y,n])=>y+'년 '+n+'개').join(', ')}.</p>
    <h4>어떤 요인이 실제로 통했나 (순위상관 IC)</h4><canvas id="pi${k}" height="${fs.length*22+30}"></canvas>
    <p class="ex">IC = 요인 순위와 이후 수익률 순위의 상관(−1~1). 0.05 이상이면 꽤 의미 있음. 진한 막대 = 세 시점 모두에서 플러스라서 점수에 쓴 요인.</p>
    ${Object.keys(r.traps||{}).length?`<h4>함정 규칙 검증 (싼 주식 상위 30% 안에서)</h4><table><tr><th>규칙</th><th class="n">함정</th><th class="n">나머지</th></tr>${Object.entries(r.traps).map(([t,v])=>`<tr><td>${t} <span class="ex">${v.trap_n}개</span></td><td class="n">${pc(v.trap_med,0)}</td><td class="n">${pc(v.rest_med,0)}</td></tr>`).join('')}</table><p class="ex">함정 그룹이 5%p 이상 나빴던 규칙만 위험 신호로 써요.</p>`:''}</div>`};
  const TMd=D.timing||{}, tm=(k,name)=>{const t=TMd[k]; if(!t) return ''; return `<div class="card"><div class="cardtitle">${name}: 언제 사고 언제 팔았어야 했나</div><h4>매수 신호 (점수 상위 20% 종목, 60거래일 뒤)</h4><table><tr><th>신호</th><th class="n">중앙</th><th class="n">오른 비율</th><th class="n">횟수</th></tr>${Object.values(t.signals).filter(x=>x.top).map(x=>`<tr><td>${x.label}</td><td class="n">${pc(x.top.med60,1)}</td><td class="n">${F(x.top.win60,0)}%</td><td class="n">${W(x.top.n)}</td></tr>`).join('')}</table><h4>매도 규칙 (4월에 상위 20%를 사서 12개월)</h4><table><tr><th>규칙</th><th class="n">평균</th><th class="n">중앙</th><th class="n">최악 10%</th><th class="n">이긴 비율</th></tr>${Object.values(t.exits).map(x=>`<tr><td>${x.label}</td><td class="n">${pc(x.mean,1)}</td><td class="n">${pc(x.med,1)}</td><td class="n">${pc(x.worst10,0)}</td><td class="n">${F(x.win,0)}%</td></tr>`).join('')}</table></div>`};
  return reg('KR','한국')+tm('KR','한국')+reg('US','미국')+tm('US','미국')+`<div class="card"><div class="cardtitle">이 검증의 한계</div>${B('bad','',['지금 상장된 회사만 볼 수 있어서 그사이 상장폐지된 회사가 빠져 있어요(생존 편향). 실제보다 결과가 좋게 나올 수 있어요.','시점이 3개뿐이라 운이 섞일 수 있어요. 매일 쌓이는 결과로 계속 다시 검증해요.','수수료·세금·호가 차이는 빼고 계산했어요.'])}</div>`;
}
function drawProof(){
  const v=css(), BT=D.backtest||{};
  setTimeout(()=>{for(const k of ['KR','US']){const r=BT[k]; if(!r) continue;
    mk('pw'+k,{type:'bar',data:{labels:r.walk.map(w=>w.test+'.04'),datasets:[{label:'점수 상위 20%',data:r.walk.map(w=>w.top20_med),backgroundColor:v('--blue'),borderRadius:6},{label:'전체',data:r.walk.map(w=>w.all_med),backgroundColor:v('--mute')+'66',borderRadius:6}]},options:{...base(),scales:{x:{grid:{display:false}},y:{grid:{color:v('--line')},ticks:{callback:x=>x+'%'}}}}});
    const fs=Object.entries(r.factors).sort((a,b)=>b[1].ic_mean-a[1].ic_mean), used=r.weights||{};
    mk('pi'+k,{type:'bar',data:{labels:fs.map(f=>f[1].label),datasets:[{label:'평균 IC',data:fs.map(f=>f[1].ic_mean),backgroundColor:fs.map(f=>used[f[0]]?v('--blue'):v('--mute')+'55'),borderRadius:4}]},options:{...base(),indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:v('--line')}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});}},30);
}

/* ---------- 내 종목·계산법 ---------- */
function mine(){
  const P=D.picks||[];
  if(!P.length) return `<div class="card"><div class="cardtitle">아직 산 종목이 없어요</div><p style="font-size:15px;color:var(--ink2)">토스에서 사면 Claude에게 이렇게 말해 주세요.</p><p class="note">"티앤엘 10월 6일에 27,600원에 1주 샀어"</p><p class="sub">그날부터 매일 수익률을 계산하고, 오르거나 내린 이유를 시장 때문인지 회사 때문인지 나눠서 분석해요. 배운 점은 다음 분석에 반영돼요.</p></div>`;
  return P.map(p=>`<div class="card"><div class="cardtitle">${esc(p.name)}</div><p class="sub">${p.date} ${W(p.price)}에 사서 지금 ${W(p.now)}</p>
  <div class="range3"><div><b>${pc(p.ret)}</b><span>내 수익률</span></div><div><b>${pc(p.market_part)}</b><span>시장 때문</span></div><div><b>${pc(p.own_part)}</b><span>회사 때문</span></div></div>
  <p class="ex">시장 몫 = 베타 ${F(p.beta,2)} × 같은 기간 지수 ${pc(p.mkt)}</p>
  ${p.note?`${B(p.ret>=0?'good':'bad',p.ret>=0?'왜 올랐나':'왜 내렸나',p.note.why)}${B('info','배운 점과 분석 업그레이드',p.note.lesson)}`:''}
  ${p.news&&p.news.length?`<h4>산 뒤 나온 뉴스</h4><ul class="news">${p.news.map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join('')}</ul>`:''}</div>`).join('');
}
function how(){
  return `<div class="card"><div class="cardtitle">매일 아침 이렇게 계산해요</div>
  ${B('','1. 후보 고르기',['한국(코스피·코스닥)과 미국(나스닥·뉴욕·아멕스) 전 종목 중 1주 3만원 이하, 시가총액이 작은 회사만 남겨요. 한국 500억~1조원, 미국 3억~150억 달러.','스팩·리츠·펀드·우선주·거래정지 종목은 빼요.'])}
  ${B('','2. 6가지 점수 (육각형 모양)',['가치: 본업 PER(시가총액 ÷ 최근 4분기 영업이익의 세후값), PBR. 일회성 이익으로 싸 보이는 함정을 피해요.','수익성: ROE, 영업이익률','성장: 연간 매출 연평균 성장률','모멘텀: 최근 분기 매출·영업이익이 1년 전보다 늘었는지','안정: 부채비율, 당좌·유동비율','추세: 로그 주가 회귀 기울기×R² + 12-1 모멘텀. RSI 75 이상 과열은 감점'])}
  ${B('','3. 총점',['6개 백분위 평균×0.8 + F점수(0~7)×20/7 − 위험 신호 1개당 15점','위험 신호: 부채비율 200% 초과, 연속 적자, 영업적자, 일회성 이익 의심, 주식 수 10% 이상 증가, 5달러 미만 페니주, 상장 유지 경고'])}
  ${B('','4. 공식 자료로 다시 확인',['한국은 DART 사업보고서, 미국은 SEC 공시에서 매출·영업이익·현금흐름·부채를 받아 네이버 숫자와 비교해요.'])}
  ${B('','5. 서술 분석과 순위',['Claude가 실적 발표·공시·뉴스를 직접 읽고 해자·촉매·위험을 써요.','순위 = 이익의 질 35% + 가격 매력 25% + 6개월 촉매 25% − 위험 15%'])}
  ${B('bad','한계',['과거 숫자는 미래를 보장하지 않아요. 소형주는 하루에 ±30%까지 움직일 수 있어요.','확률 모형은 방향이 아니라 흔들림의 크기만 알려줘요.'])}</div>`;
}
